<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ef">
<title>My Skin OS ✨</title>
<style>
:root{
  --bg:#f7f3ef;
  --bg2:#fbf8f5;
  --card:rgba(255,255,255,.92);
  --ink:#302a27;
  --muted:#817770;
  --line:#e9dfd8;
  --accent:#a8786d;
  --accent-dark:#76564f;
  --soft:#f2e8e3;
  --soft2:#f7efeb;
  --gold:#b59a76;
  --good:#52765f;
  --bad:#ad5c58;
  --shadow:0 12px 34px rgba(65,48,38,.07);
  --shadow-sm:0 5px 18px rgba(65,48,38,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 92% 0%,rgba(201,169,155,.13),transparent 27rem),
    radial-gradient(circle at 0% 32%,rgba(222,204,189,.16),transparent 24rem),
    var(--bg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.wrap{max-width:920px;margin:auto;padding:20px 17px 54px}
header{
  position:relative;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
  padding:8px 4px 20px;
}
header:after{
  content:"";
  position:absolute;left:4px;right:4px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent);
}
.brand-kicker{
  margin:0 0 4px;
  color:var(--accent-dark);
  font-size:10px;
  font-weight:700;
  letter-spacing:2.2px;
  text-transform:uppercase;
}
h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:31px;
  line-height:1.08;
  letter-spacing:-.8px;
}
h1 span{font-style:italic;color:var(--accent)}
h2{
  margin:0 0 9px;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:21px;
  letter-spacing:-.25px;
}
h3{margin:0 0 5px;font-size:16px;font-weight:650;letter-spacing:-.1px}
p{margin:6px 0}.muted{color:var(--muted)}
.age{text-align:right;color:var(--muted);padding-top:3px}
.age b{display:block;color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:500}
.age small{display:block;font-size:11px;letter-spacing:.2px}
nav{
  display:flex;gap:7px;overflow:auto;padding:13px 1px 15px;
  position:sticky;top:0;z-index:10;
  background:linear-gradient(var(--bg) 68%,rgba(247,243,239,0));
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  white-space:nowrap;
  padding:9px 14px;
  border-radius:999px;
  background:rgba(239,231,225,.9);
  color:#6f645e;
  border:1px solid rgba(226,214,206,.8);
  transition:.18s ease;
}
nav button:hover{transform:translateY(-1px)}
nav button.active{
  background:var(--ink);color:#fff;border-color:var(--ink);
  box-shadow:0 5px 14px rgba(48,42,39,.14);
}
.card,.hero,.notice{
  background:var(--card);
  border:1px solid rgba(229,218,210,.9);
  border-radius:22px;
  padding:19px;
  margin:13px 0;
  box-shadow:var(--shadow);
  backdrop-filter:blur(8px);
}
.hero{
  position:relative;overflow:hidden;
  display:flex;justify-content:space-between;gap:18px;align-items:center;
  background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(245,234,228,.94));
}
.hero:after{
  content:"";position:absolute;width:170px;height:170px;border-radius:50%;
  right:-70px;top:-90px;border:1px solid rgba(181,154,118,.18);
}
.hero>*{position:relative;z-index:1}
.hero select{max-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}
.notice{background:linear-gradient(135deg,var(--soft2),#fbf7f4);box-shadow:none;border-color:#eadcd4}
.check{
  display:flex;gap:11px;align-items:flex-start;padding:14px 4px;
  border-top:1px solid var(--line);position:relative;touch-action:pan-y;overflow:hidden;
  background:transparent;transition:transform .18s ease,opacity .18s ease;border-radius:12px;
}
.check::before,

.check>*{position:relative;z-index:1}.check.swiping{transition:none}
.check.done{background:#edf5ef}.check.skipped{background:#f3efec}
.swipe-hint{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.check-status{display:inline-block;font-size:12px;margin-left:6px;color:var(--good)}
.check.skipped .check-status{color:#c94b48}



.check:first-of-type{border-top:0}.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px}
.pill{
  display:inline-block;border-radius:999px;padding:4px 9px;background:#eee6e0;color:#665d58;
  font-size:11px;margin:3px 4px 0 0;border:1px solid rgba(224,210,201,.8);letter-spacing:.1px
}
.pill.buy{background:#f5e2d7;color:#8a503f}.bad{color:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.primary,.secondary,.delete{border-radius:13px;padding:10px 14px;transition:.18s ease}
.primary{background:var(--ink);color:#fff;box-shadow:0 5px 15px rgba(48,42,39,.12)}
.primary:hover,.secondary:hover{transform:translateY(-1px)}
.secondary{background:#eee7e2;color:var(--ink);border:1px solid #e2d8d1}
.small{padding:7px 10px;font-size:13px}.delete{background:#f7e9e8;color:#a34e4e;font-size:18px;padding:6px 9px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:11px;margin:5px 0;color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:#c9a99e;box-shadow:0 0 0 3px rgba(168,120,109,.10)}
textarea{min-height:120px;resize:vertical}.search{max-width:250px}
.product,.shopping,.treat,.road,.day,.journal{border-top:1px solid var(--line);padding:15px 0}
.product:first-child,.shopping:first-child{border-top:0}
.product .row>div:first-child{flex:1}
.upload{display:block;border:1.5px dashed #cdbdb3;border-radius:15px;padding:15px;text-align:center;background:#fbf7f4;margin:8px 0;color:#655c56}
.upload input,.import input{display:none}
.photoBox{display:flex;gap:12px;align-items:center;background:#faf7f5;padding:10px;border-radius:15px}.photoBox img{width:82px;height:82px;object-fit:cover;border-radius:11px}
.analysis{background:#f4ece7;border-radius:15px;padding:14px;margin-top:12px}.warning{color:#8f4d3d;background:#fae9e3;padding:8px;border-radius:10px}
.empty{text-align:center;padding:25px;color:var(--muted)}
footer{text-align:center;color:#918680;font-size:11px;padding:22px;letter-spacing:.2px}
.toast{position:fixed;left:16px;right:16px;bottom:18px;background:#302a27;color:white;padding:13px 16px;border-radius:15px;text-align:center;z-index:20;box-shadow:var(--shadow)}
.monthPlan{padding:17px 0;border-top:1px solid var(--line)}
.monthPlan:first-of-type{border-top:0}
@media(max-width:600px){
  .wrap{padding:13px 12px 42px}header{padding-top:5px}.hero{align-items:flex-start;flex-direction:column}
  .hero select{max-width:none;width:100%}.search{max-width:none}.card{padding:16px;border-radius:19px}
  h1{font-size:28px}.age b{font-size:20px}
}

.ritual-hero{background:linear-gradient(135deg,#fffaf6,#f4ece7);border:1px solid #e8ddd5;border-radius:24px;padding:22px;margin-bottom:14px}
.ritual-hero h2{margin:0 0 5px;font-family:Georgia,serif;font-weight:500;letter-spacing:.01em}
.ritual-step{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start;padding:15px 0;border-bottom:1px solid #eee5df}
.ritual-step:last-child{border-bottom:0}
.ritual-num{width:36px;height:36px;border-radius:50%;background:#ead9d2;color:#5e514b;display:grid;place-items:center;font-weight:700;font-size:13px}
.ritual-step h3{margin:0 0 4px;font-size:15px}
.ritual-step p{margin:0;color:#746a64;font-size:13px;line-height:1.5}
.ritual-chip{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#f5ece8;color:#76645b;font-size:11px}

.ritual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.ritual-card{background:linear-gradient(145deg,#fffdfb,#f7efeb);border:1px solid #e9ddd6;border-radius:20px;padding:17px;position:relative}
.ritual-card h3{margin:0 0 5px;font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:18px}
.ritual-card p{margin:0;color:#746a64;font-size:13px;line-height:1.5}
.ritual-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.ritual-card .primary{margin-top:13px}
.ritual-label{position:absolute;right:13px;top:13px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8a7168}
.ritual-check{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #eee5df}
.ritual-check:last-child{border-bottom:0}
.ritual-check input{margin-top:4px;accent-color:#8f6b61}
.ritual-note{font-size:12px;color:#7b706a;margin-top:10px}
@media(max-width:640px){.ritual-grid{grid-template-columns:1fr}}

.today-ritual{padding:13px 0}.today-ritual b{font-size:16px}.today-ritual small{display:block;margin-top:4px;color:#7b706a}

/* Clean task cards: no red/green swipe bars and no directional arrows */
.swipe-bar,.swipe-indicator,.swipe-hint,.swipe-arrow,.task-arrow,.direction-arrow,
[data-swipe],.swipe-left,.swipe-right{display:none!important}
.task-card::before,.task-card::after,.task::before,.task::after{display:none!important;content:none!important}


/* v20: clean task design — no swipe bars, arrows or swipe instructions */
.task::before,.task::after,
.task-card::before,.task-card::after,
.task-row::before,.task-row::after,
.swipe::before,.swipe::after,
.swipebar,.swipe-bar,.swipe-indicator,.swipe-hint,
.swipe-arrow,.task-arrow,.direction-arrow,
.swipe-left,.swipe-right,.left-swipe,.right-swipe,
.task .arrow,.task-card .arrow,.task-row .arrow,
[class*="swipe"],[class*="Swipe"],
[class*="arrow"],[class*="Arrow"]{
  display:none!important;
  content:none!important;
  background-image:none!important;
}

</style>

function restockRecommendation(p){
  const tags = p.tags || [];
  const name = (p.name || '').toLowerCase();
  const same = state.products.filter(x =>
    x.id !== p.id && x.owned !== false && x.state !== 'abgelaufen' &&
    (x.tags || []).some(t => tags.includes(t)) &&
    x.cat === p.cat
  );
  const alternatives = same.slice(0,3);

  // Products that are not worth automatically replacing.
  if (tags.includes('retinoid')) {
    return {type:'wait', title:'Nicht automatisch nachbestellen', text:'Retinoid bleibt in deiner aktuellen Lebensphase pausiert. Erst später neu entscheiden.', alternatives:[]};
  }
  if (p.cat === 'Make-up' || p.cat === 'Probe' || p.cat === 'Supplement/Probe' || p.cat === 'Tool' ||
      p.cat === 'Körperpflege' || p.cat === 'Handpflege' || p.cat === 'Fußpflege' || p.cat === 'Augenreinigung') {
    return {type:'none', title:'Nicht automatisch nachbestücken', text:'Dieses Produkt ist kein zentraler Bestandteil deiner Gesichtspflege-Basis. Du kannst es bei Bedarf selbst nachkaufen.', alternatives:[]};
  }

  // Core products: replace with the same product if it fills a unique need.
  if (tags.includes('spf50')) {
    return {type:'buy', title:'Nachkaufen: JA', text:'Täglicher SPF 50 ist ein Kernbaustein deiner Anti-Aging-Routine. Wenn du ihn gut verträgst, ist derselbe Produkttyp sinnvoll.', alternatives};
  }
  if (tags.includes('niacinamide')) {
    const fresh = alternatives.find(x => (x.tags||[]).includes('niacinamide') && x.state !== 'abgelaufen');
    if (fresh) return {type:'alternative', title:'Nicht zwingend dasselbe nachkaufen', text:'Du hast bereits eine passende Niacinamid-Alternative. Erst diese verwenden, statt doppelt einzukaufen.', alternatives:[fresh]};
    return {type:'buy', title:'Nachkaufen: JA', text:'Niacinamid passt zu deiner Basisroutine. Ein frisches Produkt im Bereich ca. 4–5% ist die bevorzugte Nachbestückung.', alternatives};
  }
  if (tags.includes('cleansing')) {
    const fresh = alternatives.find(x => x.id !== p.id && x.state !== 'abgelaufen');
    if (fresh) return {type:'alternative', title:'Alternative vorhanden', text:'Du besitzt bereits eine passende Reinigung. Erst diese aufbrauchen, statt das leere Produkt 1:1 zu ersetzen.', alternatives:[fresh]};
    return {type:'buy', title:'Nachkaufen: JA', text:'Eine sanfte Reinigung ist ein dauerhafter Basisbaustein.', alternatives};
  }
  if (tags.includes('hyaluronic_acid') || tags.includes('hydration') || tags.includes('barrier')) {
    const fresh = alternatives.find(x => x.state !== 'abgelaufen' && x.active !== false);
    if (fresh) return {type:'alternative', title:'Nicht zwingend nachkaufen', text:'Deine Sammlung enthält bereits passende Feuchtigkeits-/Barriereschritte. Erst vorhandene Produkte verwenden.', alternatives:[fresh]};
    return {type:'conditional', title:'Nur bei Bedarf nachkaufen', text:'Feuchtigkeit ist sinnvoll, aber du musst nicht mehrere ähnliche Produkte besitzen. Nachkaufen erst, wenn kein passender Ersatz mehr vorhanden ist.', alternatives};
  }
  if (tags.some(t => ['aha','pha','bha','exfoliation'].includes(t))) {
    return {type:'conditional', title:'Nur bei konkretem Bedarf', text:'Peelings sind kein Pflichtschritt für jeden Tag. Erst prüfen, ob du sie für Poren/Unreinheiten/Textur tatsächlich brauchst.', alternatives};
  }
  if (tags.includes('mask')) {
    return {type:'none', title:'Nicht automatisch nachbestellen', text:'Masken sind ein optionaler Zusatz. Erst aufbrauchen und danach nur nachkaufen, wenn du diesen Schritt wirklich gerne nutzt.', alternatives};
  }
  if (p.cat === 'Augenpflege' || p.cat === 'Augenpads' || p.cat === 'Tuchmaske') {
    return {type:'none', title:'Nicht automatisch nachbestellen', text:'Optionaler Zusatz. Nicht nachbestücken, solange kein konkreter Bedarf besteht.', alternatives};
  }
  return {type:'conditional', title:'Nachkauf prüfen', text:'Die App möchte hier nicht blind nachkaufen. Erst prüfen, ob das Produkt eine einzigartige Aufgabe erfüllt oder bereits durch etwas aus deiner Sammlung ersetzt wird.', alternatives};
}

function addRestockForProduct(p){
  const rec = restockRecommendation(p);
  if (rec.type === 'none' || rec.type === 'wait') {
    toast(rec.title);
    return;
  }
  const existing = state.shopping.find(x => x.sourceProductId === p.id && !x.bought);
  if (!existing) {
    state.shopping.unshift({
      id:'restock-'+Date.now(),
      name:p.name,
      reason:rec.text,
      priority:rec.type==='buy'?'hoch':'mittel',
      tags:p.tags||[],
      bought:false,
      sourceProductId:p.id,
      restockType:rec.type
    });
  }
  save();
  toast('Nachkauf zur Einkaufsliste hinzugefügt.');
}

function planInfo(p){
  const t=p.tags||[], c=p.cat||'';
  if(t.includes('retinoid')) return {group:'Später',freq:'erst nach passender Lebensphase',why:'Langfristiger Wirkstoff für Hautstruktur und Falten; aktuell bewusst nicht in die aktive Routine ziehen.',priority:4};
  if(t.includes('spf50')) return {group:'Dauerhaft',freq:'täglich morgens',why:'Nicht rotieren – UV-Schutz ist der wichtigste Langzeitbaustein.',priority:1};
  if(t.includes('niacinamide')) return {group:'Dauerhaft',freq:'morgens oder abends',why:'Basiswirkstoff; nur ein Niacinamid-Serum gleichzeitig nötig.',priority:1};
  if(t.includes('cleansing')) return {group:'Dauerhaft',freq:'abends / bei Bedarf morgens',why:'Eine Reinigung reicht; vorhandene Produkte nacheinander aufbrauchen.',priority:1};
  if(t.includes('aha')||t.includes('pha')||t.includes('bha')||t.includes('exfoliation')) return {group:'Rotation',freq:'max. 1 Peelingabend/Woche',why:'Nicht stapeln. AHA/PHA und BHA werden getrennt eingesetzt und nur bei Bedarf.',priority:2};
  if(t.includes('mask')) return {group:'Rotation',freq:'1–2×/Monat nach Bedarf',why:'Alle vorhandenen Masken werden nacheinander aufgebraucht; keine Vorratskäufe.',priority:3};
  if(c==='Ampulle') return {group:'Rotation',freq:'1 Ampulle als Intensivabend, dann Pause',why:'Die sechs unterschiedlichen Ampullen werden einzeln verplant, statt parallel verwendet.',priority:2};
  if(c==='Augenpads') return {group:'Rotation',freq:'bei Bedarf / vor Terminen',why:'Optionaler Zusatz; vorhandene Packungen zuerst aufbrauchen.',priority:4};
  if(c==='Augenpflege') return {group:'Rotation',freq:'abends oder morgens',why:'Nur eine Augenpflege zur Zeit; Alternativen werden erst nach Aufbrauch gewechselt.',priority:3};
  if(t.includes('hyaluronic_acid')||t.includes('hydration')||t.includes('barrier')||t.includes('peptides')) return {group:'Rotation',freq:'morgens/abends nach Bedarf',why:'Feuchtigkeit/Barriereschritt. Ähnliche Produkte werden bewusst nacheinander statt übereinander eingesetzt.',priority:2};
  if(c==='Körperpflege'||c==='Handpflege'||c==='Fußpflege') return {group:'Nebenroutine',freq:'nach Bedarf',why:'Eigene Kategorie – nicht mit der Gesichtsroutine vermischen.',priority:5};
  if(c==='Make-up'||c==='Finish/Make-up') return {group:'Make-up',freq:'bei Bedarf',why:'Nicht Teil der Wirkstoffroutine.',priority:5};
  if(c==='Tool') return {group:'Wellness',freq:'optional',why:'Ergänzung, kein Pflichtschritt.',priority:5};
  return {group:'Rotation',freq:'nach Bedarf',why:'Zuerst vorhandenes Produkt sinnvoll aufbrauchen.',priority:4};
}
function monthName(d){return d.toLocaleDateString('de-DE',{month:'long',year:'numeric'}).replace(/^./,m=>m.toUpperCase())}
function futureMonths(n=12){
  const now=new Date(), out=[];
  for(let i=0;i<n;i++) out.push(new Date(now.getFullYear(),now.getMonth()+i,1));
  return out;
}
function productsForMonth(monthIndex){
  const all=state.products.filter(p=>p.owned!==false && p.state!=='abgelaufen');
  const rotation=all.filter(p=>planInfo(p).group==='Rotation');
  const masks=rotation.filter(p=>(p.tags||[]).includes('mask'));
  const amp=all.filter(p=>p.cat==='Ampulle');
  const exfol=all.filter(p=>(p.tags||[]).some(t=>['aha','pha','bha','exfoliation'].includes(t)));
  const samples=all.filter(p=>/Probe|probe/.test(p.state||'')||p.cat==='Probe');
  const result=[];
  if(monthIndex<3) {
    result.push(...amp.slice(monthIndex*2,monthIndex*2+2));
    result.push(...masks.slice(monthIndex,monthIndex+1));
  } else if(monthIndex<6) {
    result.push(...amp.slice(0,2).filter((_,i)=>i===monthIndex%2));
    result.push(...masks.slice(monthIndex%Math.max(1,masks.length),monthIndex%Math.max(1,masks.length)+1));
    result.push(...samples.slice((monthIndex-3)*2,(monthIndex-3)*2+2));
  } else {
    result.push(...masks.slice(monthIndex%Math.max(1,masks.length),monthIndex%Math.max(1,masks.length)+1));
    result.push(...samples.slice((monthIndex-6)*2,(monthIndex-6)*2+2));
    if(exfol[0]) result.push(exfol[monthIndex%exfol.length]);
  }
  return [...new Map(result.map(p=>[p.id,p])).values()].slice(0,5);
}

}

const ritualStepKey=(id)=>'my-skin-ritual-'+new Date().toISOString().slice(0,10)+'-'+id;
document.querySelectorAll('[data-ritual-step]').forEach(e=>{e.checked=localStorage.getItem(ritualStepKey(e.dataset.ritualStep))==='1';e.onchange=()=>{if(e.checked)localStorage.setItem(ritualStepKey(e.dataset.ritualStep),'1');else localStorage.removeItem(ritualStepKey(e.dataset.ritualStep));};});
const phase=document.getElementById('phase');if(phase)phase.onchange=()=>{state.phase=phase.value;save();render()};
document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{
  state.checks[e.dataset.check]=e.checked?'done':'open'; save(); render();
});
document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.go;save();render()});
const resetDay=document.getElementById('resetDay');if(resetDay)resetDay.onclick=()=>{if(confirm('Tages-Checkliste wirklich zurücksetzen?')){Object.keys(state.checks).forEach(k=>delete state.checks[k]);save();render();toast('Tages-Checkliste zurückgesetzt.')}};
const ja=document.getElementById('journalAdd');if(ja)ja.onclick=()=>{const note=prompt('Kurze Notiz zu deiner Haut heute (optional):','')||'';state.journal=[{date:new Date().toISOString().slice(0,10),note},...state.journal.filter(x=>x.date!==new Date().toISOString().slice(0,10))];save();render();toast('Haut-Tagebuch aktualisiert.')};
document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{const p=state.products.find(x=>x.id===e.dataset.delete);if(p&&confirm('„'+p.name+'“ wirklich aus deiner Sammlung ausmisten?')){state.products=state.products.filter(x=>x.id!==p.id);save();render();toast('Produkt ausgemistet.') }});
document.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=()=>{state.products=state.products.map(p=>p.id===e.dataset.toggle?{...p,active:!p.active}:p);save();render()});

document.querySelectorAll('[data-empty]').forEach(e=>e.onclick=()=>{
  const p=state.products.find(x=>x.id===e.dataset.empty);
  if(p){
    p.state='leer'; p.owned=true; p.active=false;
    save(); render(); toast('Produkt als leer markiert.');
  }
});
document.querySelectorAll('[data-restock]').forEach(e=>e.onclick=()=>{
  const p=state.products.find(x=>x.id===e.dataset.restock);
  if(p){ addRestockForProduct(p); render(); }
});
document.querySelectorAll('[data-no-restock]').forEach(e=>e.onclick=()=>{
  const p=state.products.find(x=>x.id===e.dataset.noRestock);
  if(p){ p.state='leer – nicht nachbestücken'; p.owned=false; p.active=false; save(); render(); toast('Kein Nachkauf vorgemerkt.'); }
});
document.querySelectorAll('[data-buy]').forEach(e=>e.onclick=()=>{const p=state.products.find(x=>x.id===e.dataset.buy);if(p){state.shopping=[{id:'shop-'+Date.now(),name:p.name.replace(/\s*\\(Neu kaufen\\)/i,''),reason:'Für deine Routine vorgemerkt.',priority:'hoch',tags:p.tags||[],bought:false},...state.shopping];save();toast('Auf Einkaufsliste gesetzt.')}});
document.querySelectorAll('[data-bought]').forEach(e=>e.onclick=()=>{state.shopping=state.shopping.map(x=>x.id===e.dataset.bought?{...x,bought:true}:x);save();render()});
const si=document.getElementById('shopAdd');if(si)si.onclick=()=>{const inp=document.getElementById('shopInput'),v=inp.value.trim();if(!v)return;state.shopping=[{id:'shop-'+Date.now(),name:v,reason:'Von dir vorgemerkt.',priority:'mittel',tags:[],bought:false},...state.shopping];save();inp.value='';render();toast('Zur Einkaufsliste hinzugefügt.')};

document.querySelectorAll('[data-swipe]').forEach(row=>{
  let sx=0, sy=0, active=false;
  row.addEventListener('touchstart',ev=>{
    if(!ev.touches[0]) return;
    sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; active=true;
    row.classList.add('swiping');
  },{passive:true});
  row.addEventListener('touchmove',ev=>{
    if(!active||!ev.touches[0]) return;
    const dx=ev.touches[0].clientX-sx, dy=ev.touches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>8){
      row.style.transform=`translateX(${Math.max(-95,Math.min(95,dx))}px)`;
      row.style.opacity=String(Math.max(.65,1-Math.abs(dx)/260));
      const pct=Math.min(100,Math.round(Math.abs(dx)/95*100));
      row.style.setProperty('--swipe-progress', pct+'%');
      if(dx<0){
        row.style.setProperty('--left-width', pct+'%');
        row.style.setProperty('--right-width','0%');
      }else{
        row.style.setProperty('--right-width', pct+'%');
        row.style.setProperty('--left-width','0%');
      }
    }
  },{passive:true});
  row.addEventListener('touchend',()=>{
    if(!active) return;
    const dx=parseFloat((row.style.transform||'translateX(0px)').match(/-?\d+/)?.[0]||0);
    active=false; row.classList.remove('swiping'); row.style.transform=''; row.style.opacity=''; row.style.setProperty('--left-width','0%'); row.style.setProperty('--right-width','0%');
    if(Math.abs(dx)>=60){
      const key=row.dataset.swipe;
      state.checks[key]=dx>0?'done':'skipped';
      save(); render();
      toast(dx>0?'✓ Schritt erledigt':'↩ Schritt für heute übersprungen');
    }
  });
});

const filter=document.getElementById('filter');if(filter)filter.oninput=()=>{const q=filter.value.toLowerCase();document.querySelectorAll('[data-product]').forEach(e=>e.style.display=e.dataset.product.includes(q)?'':'none')};
const analyzeBtn=document.getElementById('analyze');if(analyzeBtn)analyzeBtn.onclick=()=>{const n=document.getElementById('pname').value.trim(),i=document.getElementById('inci').value.trim();if(!n){toast('Bitte zuerst einen Produktnamen eingeben.');return}showAnalysis(n,i)};
const photo=document.getElementById('photo');if(photo)photo.onchange=()=>{const f=photo.files[0];if(!f)return;const area=document.getElementById('photoArea');area.innerHTML=`<div class="photoBox"><img src="${URL.createObjectURL(f)}" alt="Etikett"><div><b>${esc(f.name)}</b><br><button class="secondary small" id="ocrBtn">📖 Foto auslesen</button></div></div>`;document.getElementById('ocrBtn').onclick=()=>ocr(f)};
const ex=document.getElementById('export');if(ex)ex.onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-skin-os-backup.json';a.click()};
const im=document.getElementById('import');if(im)im.onchange=()=>{const f=im.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast('Backup importiert.')}catch{toast('Backup konnte nicht gelesen werden.')}};r.readAsText(f)};
}
function showAnalysis(n,i){const a=analyze(n,i);document.getElementById('analysis').innerHTML=`<div class="analysis"><h3>${a.blocked?'⚠️ Pausieren empfohlen':'✨ '+esc(a.slot)}</h3><p><b>Kategorie:</b> ${esc(a.cat)}</p><p><b>Erkannt:</b> ${a.tags.map(t=>`<span class="pill">${esc(tagMeta[t]||t)}</span>`).join('')||'noch nichts Eindeutiges'}</p><p>${esc(a.reason)}</p>${a.conflicts.map(c=>`<p class="warning">⚠️ ${esc(c)}</p>`).join('')}<div class="row"><button class="primary" id="acceptProduct">Übernehmen</button><button class="secondary" id="discardAnalysis">Verwerfen</button></div></div>`;document.getElementById('acceptProduct').onclick=()=>{state.products.unshift({id:'p-'+Date.now(),name:n,inci:i,cat:a.cat,tags:a.tags,state:a.blocked?'pausiert – Lebensphase':'neu · vorgeschlagen',active:!a.blocked,owned:true,needed:false,source:'Scanner'});save();render();toast('Produkt gespeichert.')};document.getElementById('discardAnalysis').onclick=()=>document.getElementById('analysis').innerHTML=''}
async function ocr(file){const area=document.getElementById('photoArea');area.innerHTML+='<p class="muted" id="ocrStatus">📖 OCR wird geladen…</p>';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}const r=await Tesseract.recognize(file,'eng',{logger:m=>{const el=document.getElementById('ocrStatus');if(el&&m.status)el.textContent='📖 '+m.status+' '+(m.progress?Math.round(m.progress*100)+'%':'')}});const text=r.data.text||'';document.getElementById('inci').value=text;const lines=text.split(/\\n+/).map(x=>x.trim()).filter(Boolean);if(lines[0])document.getElementById('pname').value=lines[0].slice(0,100);const el=document.getElementById('ocrStatus');if(el)el.textContent='✅ Text erkannt – bitte prüfen und dann analysieren.'}catch(e){const el=document.getElementById('ocrStatus');if(el)el.textContent='⚠️ OCR konnte nicht geladen werden. Bitte Name/INCI manuell eintragen.'}}
try{render();}catch(e){
  console.error(e);
  state={tab:'today',phase:'breastfeeding',products:seed,checks:{},shopping:shoppingDefaults.map(x=>({...x})),journal:[],ritualActive:'gua'};
  try{save();render();}catch(e2){document.getElementById('app').innerHTML='<div class="card"><h2>My Skin OS</h2><p>Die App konnte die gespeicherten Daten nicht laden. Bitte Seite einmal neu laden.</p></div>';console.error(e2);}
}
</script>
</body>
</html>
