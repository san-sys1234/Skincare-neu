  if(a.blocked) return {role:null,mode:'pausiert',label:'Nicht in die aktuelle Routine integrieren',text:'Dieses Produkt bleibt wegen deiner aktuellen Lebensphase pausiert.'};
  if(tags.includes('cleansing')) return {role:'cleanser',mode:'basis',label:'Tägliche Reinigung',text:'Wird morgens und abends als dein täglicher Gesichtsreiniger eingesetzt.'};
  if(tags.includes('spf50')) return {role:'spf',mode:'basis',label:'Täglicher SPF',text:'Wird morgens als letzter Pflegeschritt eingesetzt. Ein SPF ersetzt keinen anderen Pflegebedarf und umgekehrt.'};
  if(tags.some(t=>['aha','pha','bha','exfoliation'].includes(t))) return {role:'peeling',mode:'rotation',label:'Peeling-Rotation',text:'Wird ausschließlich in die bestehende Peeling-Rotation eingeordnet – nicht zusätzlich und nicht zusammen mit einem anderen Peeling.'};
  if(cat==='Creme'||/creme|cream|moistur|lotion/i.test(n)) return {role:'cream',mode:'rotation',label:'Basiscreme',text:'Wird als mögliche Basiscreme morgens und abends verwendet – nicht zusätzlich zu einer zweiten Gesichtscreme.'};
  if(tags.includes('niacinamide')) return {role:'niacinamide',mode:'basis',label:'Niacinamid-Schritt',text:'Kann den Niacinamid-Schritt übernehmen. Ein zweites Niacinamid-Serum wird nicht parallel eingeplant.'};
  if(tags.includes('vitamin_c')) return {role:'vitamin_c',mode:'rotation',label:'Antioxidativer Morgenschritt',text:'Wird morgens vor Creme und SPF eingeordnet, sofern bereits ein passender Vitamin-C-Schritt vorhanden ist, ersetzt es diesen statt ihn zu ergänzen.'};
  if(tags.some(t=>['hyaluronic_acid','hydration','barrier','repair','peptides'].includes(t))) return {role:'serum',mode:'rotation',label:'Serum-Rotation',text:'Wird als Serum in die bestehende Rotation aufgenommen – nicht zusätzlich zu mehreren anderen Seren am selben Tag.'};
  if(tags.includes('mask')||cat==='Augenpflege'||cat==='Augenpads'||cat==='Tuchmaske') return {role:'ritual',mode:'optional',label:'Beauty-Ritual / Rotation',text:'Wird nur am passenden Ritualtag bzw. nach Bedarf verwendet, nicht täglich.'};
  return {role:null,mode:'manual',label:'Nicht automatisch einplanen',text:'Das Produkt wird gespeichert, aber nicht ungeprüft in die tägliche Gesichtsroutine gesetzt.'};
}
function isoWeekNumber(d){
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day);
  const yearStart=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return Math.ceil((((x-yearStart)/86400000)+1)/7);
}

    3:['lancome-genifique','chanel-hydra','no-hyaluron'],

  const mask=currentMask();

function missingDecision(label){
  const n=(label||'').toLowerCase();
  if(n.includes('creme')) return {kind:'buy',text:'⚠️ FEHLT · BITTE KAUFEN: La Roche-Posay Toleriane Dermallergo Creme'};
  if(n.includes('lancaster spf') || n.includes('spf 50')) return {kind:'buy',text:'⚠️ FEHLT · BITTE KAUFEN: La Roche-Posay Anthelios UVMune 400 Invisible Fluid LSF 50+'};
  if(n.includes('reinigen')) return {kind:'buy',text:'⚠️ FEHLT · BITTE KAUFEN: CeraVe Schäumendes Reinigungsgel'};
  if(n.includes('peeling-abend')) return {kind:'none',text:'⚪ NICHT KAUFEN · Kein neues Peeling nötig. Die App nutzt vorhandene Peelings in Rotation.'};
  if(n.includes('gua sha glow')) return {kind:'none',text:'⚪ KEIN KAUF NÖTIG · Das Ritual kann ohne die Kapsel entfallen; Gua Sha ist ein optionales Extra.'};
  if(n.includes('eye rescue')) return {kind:'none',text:'⚪ KEIN KAUF NÖTIG · Augenpads sind ein optionales Extra; vorhandene Pads werden aufgebraucht.'};
  if(n.includes('hydration reset')) return {kind:'none',text:'⚪ KEIN KAUF NÖTIG · Eine zusätzliche Maske muss nicht gekauft werden.'};
  if(n.includes('sunday beauty reset')) return {kind:'none',text:'⚪ KEIN KAUF NÖTIG · Die Ampulle ist ein optionaler Boost und wird nicht ersetzt.'};
  if(n.includes('serum')) return {kind:'none',text:'⚪ KEIN KAUF NÖTIG · Die Basisroutine funktioniert ohne zusätzliches Serum; vorhandene Seren werden rotiert.'};
  return {kind:'none',text:'⚪ KEIN KAUF NÖTIG · Dieser Schritt ist ein optionales Extra.'};
}

function addRestockForProduct(p){
  const rec = restockRecommendation(p);
  if (rec.type === 'none' || rec.type === 'wait') {
    toast(rec.title);
    return;
  }
  const existing = state.shopping.find(x => x.sourceProductId === p.id && !x.bought);
  if (!existing) {
    const chosen = rec.top3 && rec.top3[0] ? rec.top3[0] : null;
    state.shopping.unshift({
      id:'restock-'+Date.now(),
      name:chosen ? chosen.name : p.name,
      reason:rec.text,
      priority:rec.type==='buy'?'hoch':'mittel',
      tags:p.tags||[],
      bought:false,
      sourceProductId:p.id,
      restockType:rec.type,
      recommendation:chosen ? chosen.name : ''
    });
  }
  save();
  toast('Nachkauf zur Einkaufsliste hinzugefügt.');
}

function planInfo(p){
  const t=p.tags||[], c=p.cat||'';
  if(t.includes('retinoid')) return {group:'Später',freq:'erst nach passender Lebensphase',why:'Langfristiger Wirkstoff für Hautstruktur und Falten; aktuell bewusst nicht in die aktive Routine ziehen.',priority:4};
  if(t.includes('spf50')) return {group:'Dauerhaft',freq:'täglich morgens',why:'Nicht rotieren – UV-Schutz ist der wichtigste Langzeitbaustein.',priority:1};
  if(t.includes('niacinamide')) return {group:'Dauerhaft',freq:'morgens oder abends',why:'Basiswirkstoff; nur ein Niacinamid-Serum gleichzeitig nötig.',priority:1};
  if(t.includes('cleansing')) return {group:'Dauerhaft',freq:'abends / bei Bedarf morgens',why:'Eine Reinigung reicht; vorhandene Produkte nacheinander aufbrauchen.',priority:1};
  if(t.includes('aha')||t.includes('pha')||t.includes('bha')||t.includes('exfoliation')) return {group:'Rotation',freq:'max. 1 Peelingabend/Woche',why:'Nicht stapeln. AHA/PHA und BHA werden getrennt eingesetzt und nur bei Bedarf.',priority:2};
  if(t.includes('mask')) return {group:'Rotation',freq:'1×/Woche nach festem Rotationsplan',why:'Die App wählt jede Woche genau eine vorhandene Maske aus; keine parallelen Masken und keine Nachkäufe.',priority:3};
  if(c==='Ampulle') return {group:'Rotation',freq:'1 Ampulle als Intensivabend, dann Pause',why:'Die sechs unterschiedlichen Ampullen werden einzeln verplant, statt parallel verwendet.',priority:2};
  if(c==='Augenpads') return {group:'Rotation',freq:'bei Bedarf / vor Terminen',why:'Optionaler Zusatz; vorhandene Packungen zuerst aufbrauchen.',priority:4};
  if(c==='Augenpflege') return {group:'Rotation',freq:'abends oder morgens',why:'Nur eine Augenpflege zur Zeit; Alternativen werden erst nach Aufbrauch gewechselt.',priority:3};
  if(t.includes('hyaluronic_acid')||t.includes('hydration')||t.includes('barrier')||t.includes('peptides')) return {group:'Rotation',freq:'morgens/abends nach Bedarf',why:'Feuchtigkeit/Barriereschritt. Ähnliche Produkte werden bewusst nacheinander statt übereinander eingesetzt.',priority:2};
  if(c==='Pflegekapseln') return {group:'Rotation',freq:'Dienstag · Gua-Sha-Rotation',why:'Reichhaltige Ölpflege für Massage; 1 Kapsel pro Einsatz, danach Creme.',priority:3};
  if(c==='Körperpflege'||c==='Handpflege'||c==='Fußpflege') return {group:'Nebenroutine',freq:'nach Bedarf',why:'Eigene Kategorie – nicht mit der Gesichtsroutine vermischen.',priority:5};
  if(c==='Make-up'||c==='Finish/Make-up') return {group:'Make-up',freq:'bei Bedarf',why:'Nicht Teil der Wirkstoffroutine.',priority:5};
  if(c==='Tool') return {group:'Wellness',freq:'optional',why:'Ergänzung, kein Pflichtschritt.',priority:5};
  return {group:'Rotation',freq:'nach Bedarf',why:'Zuerst vorhandenes Produkt sinnvoll aufbrauchen.',priority:4};
}
function monthName(d){return d.toLocaleDateString('de-DE',{month:'long',year:'numeric'}).replace(/^./,m=>m.toUpperCase())}
function futureMonths(n=12){
  const now=new Date(), out=[];
  for(let i=0;i<n;i++) out.push(new Date(now.getFullYear(),now.getMonth()+i,1));
  return out;
}
function productsForMonth(monthIndex){
  const all=state.products.filter(p=>p.owned!==false && p.state!=='abgelaufen');
  const rotation=all.filter(p=>planInfo(p).group==='Rotation');
  const masks=rotation.filter(p=>(p.tags||[]).includes('mask'));
  const amp=all.filter(p=>p.cat==='Ampulle');
  const exfol=all.filter(p=>(p.tags||[]).some(t=>['aha','pha','bha','exfoliation'].includes(t)));
  const samples=all.filter(p=>/Probe|probe/.test(p.state||'')||p.cat==='Probe');
  const result=[];
  if(monthIndex<3) {
    result.push(...amp.slice(monthIndex*2,monthIndex*2+2));
    result.push(...masks.slice(monthIndex,monthIndex+1));
  } else if(monthIndex<6) {
    result.push(...amp.slice(0,2).filter((_,i)=>i===monthIndex%2));
    result.push(...masks.slice(monthIndex%Math.max(1,masks.length),monthIndex%Math.max(1,masks.length)+1));
    result.push(...samples.slice((monthIndex-3)*2,(monthIndex-3)*2+2));
  } else {
    result.push(...masks.slice(monthIndex%Math.max(1,masks.length),monthIndex%Math.max(1,masks.length)+1));
    result.push(...samples.slice((monthIndex-6)*2,(monthIndex-6)*2+2));
    if(exfol[0]) result.push(exfol[monthIndex%exfol.length]);
  }
  return [...new Map(result.map(p=>[p.id,p])).values()].slice(0,5);
}

document.querySelectorAll('[data-swipe]').forEach(el=>{
  let startX=0,startY=0,tracking=false,moved=false;

  el.addEventListener('touchstart',ev=>{
    if(el.classList.contains('disabled')) return;
    const t=ev.touches[0]; startX=t.clientX; startY=t.clientY; tracking=true; moved=false;
    el.style.transition='none';
  },{passive:true});
  el.addEventListener('touchmove',ev=>{
    if(!tracking) return;
    const t=ev.touches[0], dx=t.clientX-startX, dy=t.clientY-startY;
    if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)){ moved=true; el.style.transform=`translateX(${Math.max(-80,Math.min(80,dx))}px)`; }
  },{passive:true});

    const t=ev.changedTouches[0], dx=t.clientX-startX, dy=t.clientY-startY;

      el.style.transform=''; save(); render();

  },{passive:false});
});

 if(!name&&!brand&&!inci&&!box.querySelector('[data-review-front]')?.dataset.dataUrl&&!box.querySelector('[data-review-back]')?.dataset.dataUrl){toast('Bitte mindestens Produktname, INCI oder ein Foto ergänzen.');return;}
 p.review={...(p.review||{}),name,brand,inci,front:box.querySelector('[data-review-front]')?.dataset.dataUrl||p.review?.front||'',back:box.querySelector('[data-review-back]')?.dataset.dataUrl||p.review?.back||'',pending:true,updatedAt:new Date().toISOString()};
 p.note=((p.note||'').replace(/\s*Prüfung ausstehend\.?/i,'').trim()+' Prüfung ausstehend.').trim();
 save();render();toast('Produktprüfung gespeichert.');
});
document.querySelectorAll('[data-cancel-edit]').forEach(e=>e.onclick=()=>e.closest('.product-editor')?.remove());
document.querySelectorAll('[data-save-product]').forEach(e=>e.onclick=()=>{
 const p=state.products.find(x=>x.id===e.dataset.saveProduct); const box=e.closest('.product-editor'); if(!p||!box)return;
 const name=box.querySelector('[data-edit-name]').value.trim(); if(!name){toast('Bitte einen Produktnamen eingeben.');return;}
 p.name=name; p.cat=box.querySelector('[data-edit-cat]').value; p.state=box.querySelector('[data-edit-state]').value.trim()||'neu · geprüft'; p.quantity=Math.max(0,Number(box.querySelector('[data-edit-qty]').value)||1); p.note=box.querySelector('[data-edit-note]').value.trim();
 if(p.state.toLowerCase().includes('pausiert'))p.active=false;
 save();render();toast('Produkt geändert.');
});
document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{const p=state.products.find(x=>x.id===e.dataset.delete);if(p&&confirm('„'+p.name+'“ wirklich aus deiner Sammlung ausmisten?')){state.products=state.products.filter(x=>x.id!==p.id);save();render();toast('Produkt ausgemistet.') }});
document.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=()=>{state.products=state.products.map(p=>p.id===e.dataset.toggle?{...p,active:!p.active}:p);save();render()});

document.querySelectorAll('[data-empty]').forEach(e=>e.onclick=()=>{
  const p=state.products.find(x=>x.id===e.dataset.empty);
  if(p){
    p.state='leer'; p.owned=true; p.active=false;
    save(); render(); toast('Produkt als leer markiert.');
  }
});
document.querySelectorAll('[data-restock]').forEach(e=>e.onclick=()=>{
  const p=state.products.find(x=>x.id===e.dataset.restock);
  if(p){ addRestockForProduct(p); render(); }
});
document.querySelectorAll('[data-no-restock]').forEach(e=>e.onclick=()=>{
  const p=state.products.find(x=>x.id===e.dataset.noRestock);
  if(p){ p.state='leer – nicht nachbestücken'; p.owned=false; p.active=false; save(); render(); toast('Kein Nachkauf vorgemerkt.'); }
});
document.querySelectorAll('[data-buy]').forEach(e=>e.onclick=()=>{const p=state.products.find(x=>x.id===e.dataset.buy);if(p){state.shopping=[{id:'shop-'+Date.now(),name:p.name.replace(/\s*\\(Neu kaufen\\)/i,''),reason:'Für deine Routine vorgemerkt.',priority:'hoch',tags:p.tags||[],bought:false},...state.shopping];save();toast('Auf Einkaufsliste gesetzt.')}});
document.querySelectorAll('[data-open-url]').forEach(e=>e.onclick=()=>window.open(e.dataset.openUrl,'_blank','noopener'));
document.querySelectorAll('[data-add-recommendation]').forEach(e=>e.onclick=()=>{const p=state.products.find(x=>x.id===e.dataset.addRecommendation);if(!p)return;const name=e.dataset.recommendationName;const existing=state.shopping.find(x=>x.name===name&&!x.bought);if(existing){toast('Bereits auf der Einkaufsliste.');return;}state.shopping.unshift({id:'restock-'+Date.now(),name,reason:'Produktvorschlag aus deiner Nachkaufentscheidung.',priority:'hoch',tags:p.tags||[],bought:false,sourceProductId:p.id,restockType:'buy',recommendation:name});save();toast(`${name} wurde zur Einkaufsliste hinzugefügt.`);render();});
document.querySelectorAll('[data-bought]').forEach(e=>e.onclick=()=>{
  const item=state.shopping.find(x=>x.id===e.dataset.bought);
  if(!item)return;
  const productTemplates={
    'CeraVe Schäumendes Reinigungsgel':{cat:'Reinigung',tags:['cleansing'],state:'Basisroutine',active:true},
    'La Roche-Posay Toleriane Dermallergo Creme':{cat:'Creme',tags:['hydration','barrier'],state:'Basisroutine',active:true},
    'CeraVe Feuchtigkeitsspendende Gesichtscreme':{cat:'Creme',tags:['hydration','barrier','ceramides','hyaluronic_acid','niacinamide'],state:'Rotation',active:true},
    'Eucerin UltraSensitive Beruhigende Pflege für trockene Haut':{cat:'Creme',tags:['hydration','barrier'],state:'Rotation',active:true},
    'La Roche-Posay Anthelios UVMune 400 Invisible Fluid LSF 50+':{cat:'SPF',tags:['spf50','uv_protection'],state:'täglich',active:true},
    'Eucerin Sun Face Oil Control Dry Touch Gel-Creme LSF 50+':{cat:'SPF',tags:['spf50','uv_protection'],state:'Rotation',active:true},
    'Lancaster Sun Beauty Face Cream SPF 50':{cat:'SPF',tags:['spf50','uv_protection'],state:'täglich',active:true},
    'La Roche-Posay Cicaplast Lavant B5 Reinigungsgel':{cat:'Reinigung',tags:['cleansing'],state:'Rotation',active:true},
    'Eucerin DermatoCLEAN [HYALURON] Reinigungsgel':{cat:'Reinigung',tags:['cleansing','hyaluronic_acid'],state:'Rotation',active:true}
  };
  const key=Object.keys(productTemplates).find(k=>k.toLowerCase()===String(item.name||'').toLowerCase());
  const tpl=key?productTemplates[key]:null;
  const existing=state.products.find(p=>p.name.toLowerCase()===String(item.name||'').toLowerCase()&&p.owned!==false);
  if(existing){
    existing.owned=true; existing.active=existing.active!==false?true:true;
    if(existing.state&&/^leer/i.test(existing.state)) existing.state=tpl?tpl.state:'aufbrauchen';
    item.bought=true; save(); render(); toast('Produkt ist bereits vorhanden und wurde wieder aktiviert.'); return;
  }
  if(tpl){
    state.products.unshift({id:'p-buy-'+Date.now(),name:key,cat:tpl.cat,tags:tpl.tags,state:tpl.state,active:tpl.active,owned:true,needed:false,source:'Einkaufsliste',routineRole:null});
    item.bought=true; save(); render(); toast(key+' wurde gekauft und in Produkte übernommen.');
  }else{
    item.bought=true; save(); render(); toast('Als gekauft markiert. Bitte das Produkt unter „Produkte“ noch einmal einordnen.');
  }
});
const si=document.getElementById('shopAdd');if(si)si.onclick=()=>{const inp=document.getElementById('shopInput'),v=inp.value.trim();if(!v)return;state.shopping=[{id:'shop-'+Date.now(),name:v,reason:'Von dir vorgemerkt.',priority:'mittel',tags:[],bought:false},...state.shopping];save();inp.value='';render();toast('Zur Einkaufsliste hinzugefügt.')};
 const filter=document.getElementById('filter');if(filter)filter.oninput=()=>{const q=filter.value.toLowerCase();document.querySelectorAll('[data-product]').forEach(e=>e.style.display=e.dataset.product.includes(q)?'':'none')};
const analyzeBtn=document.getElementById('analyze');if(analyzeBtn)analyzeBtn.onclick=()=>{const n=document.getElementById('pname').value.trim(),i=document.getElementById('inci').value.trim();if(!n){toast('Bitte zuerst einen Produktnamen eingeben.');return}showAnalysis(n,i)};
const photo=document.getElementById('photo');if(photo)photo.onchange=()=>{const f=photo.files[0];if(!f)return;const area=document.getElementById('photoArea');area.innerHTML=`<div class="photoBox"><img src="${URL.createObjectURL(f)}" alt="Etikett"><div><b>${esc(f.name)}</b><br><button class="secondary small" id="ocrBtn">📖 Foto auslesen</button></div></div>`;document.getElementById('ocrBtn').onclick=()=>ocr(f)};
const ex=document.getElementById('export');if(ex)ex.onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-skin-os-backup.json';a.click()};
const im=document.getElementById('import');if(im)im.onchange=()=>{const f=im.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast('Backup importiert.')}catch{toast('Backup konnte nicht gelesen werden.')}};r.readAsText(f)};
}
function showAnalysis(n,i){
  const a=analyze(n,i), integ=integrationFor(a,n);
  const duplicateRole=integ.role?state.products.find(p=>p.routineRole===integ.role&&p.active!==false&&p.owned!==false):null;
  const duplicateNote=duplicateRole&&!a.blocked
    ? `<p class="muted">ℹ️ Es gibt bereits <b>${esc(duplicateRole.name)}</b> für dieselbe Rolle. Das neue Produkt wird deshalb als <b>Rotation/Alternative</b> geführt und nicht zusätzlich parallel eingeplant.</p>`
    : '';
  document.getElementById('analysis').innerHTML=`<div class="analysis">
    <h3>${a.blocked?'⚠️ Pausieren empfohlen':'✨ '+esc(a.slot)}</h3>
    <p><b>Kategorie:</b> ${esc(a.cat)}</p>
    <p><b>Erkannt:</b> ${a.tags.map(t=>`<span class="pill">${esc(tagMeta[t]||t)}</span>`).join('')||'noch nichts Eindeutiges'}</p>
    <p>${esc(a.reason)}</p>
    ${a.conflicts.map(c=>`<p class="warning">⚠️ ${esc(c)}</p>`).join('')}
    <div class="restock-logic" style="margin-top:12px">
      <div class="restock-decision"><span class="decision-badge ${integ.mode==='pausiert'?'wait':integ.mode==='basis'?'replace':'conditional'}">${integ.mode==='pausiert'?'⏸️':integ.mode==='basis'?'✓':'↔'} ${esc(integ.label)}</span></div>
      <p class="restock-note">${esc(integ.text)}</p>
      ${duplicateNote}
    </div>
    <div class="row"><button class="primary" id="acceptProduct">Übernehmen & sinnvoll einordnen</button><button class="secondary" id="discardAnalysis">Verwerfen</button></div>
  </div>`;
  document.getElementById('acceptProduct').onclick=()=>{
    const id='p-'+Date.now();
    const product={id,name:n,inci:i,cat:a.cat,tags:a.tags,state:a.blocked?'pausiert – Lebensphase':integ.mode==='basis'?'Basisroutine':integ.mode==='rotation'?'Rotation':integ.mode==='optional'?'gelegentlich':'neu · geprüft',active:!a.blocked,owned:true,needed:false,source:'Scanner',routineRole:integ.role||null};
    state.products.unshift(product);
    // Wenn das Produkt einen offenen Kauf ersetzt, wird der entsprechende Einkauf automatisch erledigt.
    state.shopping=state.shopping.map(x=>x.name.toLowerCase()===n.toLowerCase()?{...x,bought:true}:x);
    save();render();toast(a.blocked?'Produkt gespeichert und pausiert.':integ.label+' integriert.');
  };
  document.getElementById('discardAnalysis').onclick=()=>document.getElementById('analysis').innerHTML='';
}
async function ocr(file){const area=document.getElementById('photoArea');area.innerHTML+='<p class="muted" id="ocrStatus">📖 OCR wird geladen…</p>';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}const r=await Tesseract.recognize(file,'eng',{logger:m=>{const el=document.getElementById('ocrStatus');if(el&&m.status)el.textContent='📖 '+m.status+' '+(m.progress?Math.round(m.progress*100)+'%':'')}});const text=r.data.text||'';document.getElementById('inci').value=text;const lines=text.split(/\\n+/).map(x=>x.trim()).filter(Boolean);if(lines[0])document.getElementById('pname').value=lines[0].slice(0,100);const el=document.getElementById('ocrStatus');if(el)el.textContent='✅ Text erkannt – bitte prüfen und dann analysieren.'}catch(e){const el=document.getElementById('ocrStatus');if(el)el.textContent='⚠️ OCR konnte nicht geladen werden. Bitte Name/INCI manuell eintragen.'}}
try{render();}catch(e){
  console.error(e);
  state={tab:'today',phase:'breastfeeding',products:seed,checks:{},shopping:shoppingDefaults.map(x=>({...x})),journal:[],ritualActive:'gua'};
  try{save();render();}catch(e2){document.getElementById('app').innerHTML='<div class="card"><h2>My Skin OS</h2><p>Die App konnte die gespeicherten Daten nicht laden. Bitte Seite einmal neu laden.</p></div>';console.error(e2);}
}
</script>
</body>
